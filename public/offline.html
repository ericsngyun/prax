<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - PRAX Studio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0d0d0d;
      color: #e8e6e3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }

    .container {
      max-width: 500px;
    }

    .logo {
      width: 120px;
      height: auto;
      margin: 0 auto 2rem;
      opacity: 0.6;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: #ffffff;
      letter-spacing: 0.05em;
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #a8a29e;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      padding: 1rem 2rem;
      background: #e8e6e3;
      color: #0d0d0d;
      text-decoration: none;
      border-radius: 0.25rem;
      font-weight: 600;
      font-size: 0.875rem;
      letter-spacing: 0.05em;
      transition: opacity 0.2s ease;
    }

    .btn:hover {
      opacity: 0.8;
    }

    .status {
      margin-top: 2rem;
      padding: 1rem;
      background: rgba(232, 230, 227, 0.05);
      border-radius: 0.5rem;
      font-size: 0.875rem;
      color: #a8a29e;
    }

    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 2rem;
      opacity: 0.4;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414" />
    </svg>

    <h1>You're Offline</h1>

    <p>
      It looks like you've lost your internet connection. Some content may not be available right now.
    </p>

    <a href="/" class="btn" onclick="location.reload(); return false;">Try Again</a>

    <div class="status">
      <p style="margin: 0;">Don't worry — we've cached your recent pages so you can view them offline.</p>
    </div>
  </div>

  <script>
    // Auto-reload when connection is restored
    window.addEventListener('online', () => {
      window.location.reload();
    });

    // Check connection periodically
    setInterval(() => {
      if (navigator.onLine) {
        window.location.reload();
      }
    }, 5000);
  </script>
</body>
</html>
